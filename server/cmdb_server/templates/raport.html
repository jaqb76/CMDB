{#
  Tresc raportu - ta sama w wiadomosci i w podgladzie w panelu.

  Styl jest wpisany w atrybuty, a nie w arkusz: klienty poczty w wiekszosci
  wycinaja sekcje <style>, a Gmail robi to zawsze. Tabele zamiast siatki
  z tego samego powodu - flexbox i grid nie dzialaja w Outlooku.
#}
<div style="font-family: Segoe UI, Arial, sans-serif; color:#1c2024; max-width:760px">
  <h1 style="font-size:20px; margin:0 0 4px">{{ raport.tytul }}</h1>
  <p style="margin:0 0 20px; color:#6b7280; font-size:13px">
    {{ raport.firma }} &middot; stan na {{ raport.wygenerowano.strftime('%Y-%m-%d %H:%M') }} UTC
  </p>

  {% macro paski(dane) %}
    {% if dane %}
    <table cellpadding="0" cellspacing="0" border="0" width="100%"
           style="border-collapse:collapse; margin:0 0 18px">
      {% for p in dane %}
      <tr>
        <td style="padding:3px 10px 3px 0; font-size:13px; white-space:nowrap; width:34%">
          {{ p.etykieta }}
        </td>
        <td style="padding:3px 0">
          <table cellpadding="0" cellspacing="0" border="0" width="100%"
                 style="border-collapse:collapse">
            <tr>
              <td width="{{ p.szerokosc }}%" style="background:{{ p.barwa }}; height:16px;
                  border-radius:3px"></td>
              <td style="padding-left:8px; font-size:12px; color:#6b7280; white-space:nowrap">
                {{ p.wartosc }}{% if p.udzial %} &middot; {{ p.udzial }}%{% endif %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}
  {% endmacro %}

  {% macro kafelek(wartosc, opis, alarm=false) %}
    <td style="padding:12px 14px; border:1px solid #dcdfe4; border-radius:6px; width:33%">
      <div style="font-size:26px; font-weight:700; line-height:1.1;
                  color:{% if alarm and wartosc %}#a52222{% else %}#1c2024{% endif %}">
        {{ wartosc }}
      </div>
      <div style="font-size:12px; color:#6b7280; margin-top:3px">{{ opis }}</div>
    </td>
  {% endmacro %}

  {% set d = raport.dane %}

  {# --- podatnosci --- #}
  {% if raport.rodzaj == 'podatnosci' %}
    <table cellpadding="0" cellspacing="8" border="0" width="100%"
           style="border-collapse:separate; margin:0 0 18px">
      <tr>
        {{ kafelek(d.powazne, 'powazne (CVSS >= 7) z gotowa poprawka', true) }}
        {{ kafelek(d.do_zrobienia, 'wszystkie do zrobienia') }}
        {{ kafelek(d.bez_poprawki, 'znane, bez dostepnej poprawki') }}
      </tr>
    </table>

    <h2 style="font-size:15px; margin:18px 0 8px">Podział według wagi</h2>
    {{ paski(d.wykres_wagi) }}

    {% if d.najgorsze %}
    <h2 style="font-size:15px; margin:18px 0 8px">Maszyny wymagajace uwagi</h2>
    <table cellpadding="6" cellspacing="0" border="0" width="100%"
           style="border-collapse:collapse; font-size:13px">
      <tr style="background:#f5f6f8">
        <th align="left" style="border-bottom:1px solid #dcdfe4">Maszyna</th>
        <th align="right" style="border-bottom:1px solid #dcdfe4">Poważne</th>
        <th align="right" style="border-bottom:1px solid #dcdfe4">Do zrobienia</th>
        <th align="right" style="border-bottom:1px solid #dcdfe4">Bez poprawki</th>
      </tr>
      {% for w in d.najgorsze %}
      <tr>
        <td style="border-bottom:1px solid #eef0f3">{{ w.maszyna.hostname }}</td>
        <td align="right" style="border-bottom:1px solid #eef0f3;
            {% if w.wynik.critical_count %}color:#a52222; font-weight:700{% endif %}">
          {{ w.wynik.critical_count }}
        </td>
        <td align="right" style="border-bottom:1px solid #eef0f3">{{ w.wynik.fixable_count }}</td>
        <td align="right" style="border-bottom:1px solid #eef0f3">{{ w.wynik.open_count }}</td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}

    {% if d.nieznane %}
    <p style="font-size:12px; color:#8a6100; margin:16px 0 0">
      Dla {{ d.nieznane | length }} maszyn nie znamy stanu podatności — to nie
      znaczy, że są bezpieczne, tylko że nie udało się ich sprawdzić.
    </p>
    {% endif %}

  {# --- sprzet --- #}
  {% elif raport.rodzaj == 'sprzet' %}
    <table cellpadding="0" cellspacing="8" border="0" width="100%"
           style="border-collapse:separate; margin:0 0 18px">
      <tr>
        {{ kafelek(d.liczba, 'maszyn w ewidencji') }}
        {{ kafelek(d.bez_kontaktu, 'bez kontaktu ponad 48 h', true) }}
        {{ kafelek(d.bez_opiekuna, 'bez przypisanego opiekuna') }}
      </tr>
    </table>

    <h2 style="font-size:15px; margin:18px 0 8px">System operacyjny</h2>
    {{ paski(d.wykres_systemy) }}

    <h2 style="font-size:15px; margin:18px 0 8px">Producent</h2>
    {{ paski(d.wykres_producenci) }}

    <h2 style="font-size:15px; margin:18px 0 8px">Wersja agenta</h2>
    {{ paski(d.wykres_agenci) }}

  {# --- gwarancje --- #}
  {% elif raport.rodzaj == 'gwarancje' %}
    <table cellpadding="0" cellspacing="8" border="0" width="100%"
           style="border-collapse:separate; margin:0 0 18px">
      <tr>
        {{ kafelek(d.po_terminie | length, 'gwarancja juz wygasla', true) }}
        {{ kafelek(d.koncza_sie | length, 'konczy sie w ' ~ d.horyzont ~ ' dni', true) }}
        {{ kafelek(d.na_gwarancji, 'objetych wsparciem') }}
      </tr>
    </table>

    {{ paski(d.wykres) }}

    {% if d.koncza_sie %}
    <h2 style="font-size:15px; margin:18px 0 8px">Kończy się w najbliższych {{ d.horyzont }} dniach</h2>
    <table cellpadding="6" cellspacing="0" border="0" width="100%"
           style="border-collapse:collapse; font-size:13px">
      <tr style="background:#f5f6f8">
        <th align="left" style="border-bottom:1px solid #dcdfe4">Maszyna</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Model</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Dostawca</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Gwarancja do</th>
      </tr>
      {% for m in d.koncza_sie %}
      <tr>
        <td style="border-bottom:1px solid #eef0f3">{{ m.hostname }}</td>
        <td style="border-bottom:1px solid #eef0f3">{{ m.model or '—' }}</td>
        <td style="border-bottom:1px solid #eef0f3">{{ m.dostawca.wartosc if m.dostawca else '—' }}</td>
        <td style="border-bottom:1px solid #eef0f3; font-weight:700">{{ m.warranty_until }}</td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}

    {% if d.po_terminie %}
    <h2 style="font-size:15px; margin:18px 0 8px">Po terminie</h2>
    <table cellpadding="6" cellspacing="0" border="0" width="100%"
           style="border-collapse:collapse; font-size:13px">
      <tr style="background:#f5f6f8">
        <th align="left" style="border-bottom:1px solid #dcdfe4">Maszyna</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Model</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Wygasła</th>
      </tr>
      {% for m in d.po_terminie[:40] %}
      <tr>
        <td style="border-bottom:1px solid #eef0f3">{{ m.hostname }}</td>
        <td style="border-bottom:1px solid #eef0f3">{{ m.model or '—' }}</td>
        <td style="border-bottom:1px solid #eef0f3; color:#a52222">{{ m.warranty_until }}</td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}

    {% if d.bez_danych %}
    <p style="font-size:12px; color:#6b7280; margin:16px 0 0">
      {{ d.bez_danych | length }} maszyn nie ma wpisanej daty gwarancji. Brak daty
      nie znaczy, że gwarancji nie ma — znaczy, że nikt jej nie uzupełnił.
    </p>
    {% endif %}

  {# --- dostepnosc uslug i certyfikaty --- #}
  {% elif raport.rodzaj == 'uslugi' %}
    <table cellpadding="0" cellspacing="8" border="0" width="100%"
           style="border-collapse:separate; margin:0 0 18px">
      <tr>
        {{ kafelek(d.niedostepne | length, 'usług nie odpowiada', true) }}
        {{ kafelek(d.wygasle | length, 'certyfikatów po terminie', true) }}
        {{ kafelek(d.koncza_sie | length, 'certyfikatów kończy się wkrótce', true) }}
      </tr>
    </table>

    <p style="font-size:13px; margin:0 0 18px">
      Monitorowanych usług: <b>{{ d.liczba }}</b>.
      Średnia dostępność z ostatnich 7 dni:
      <b>{% if d.srednia_dostepnosc is not none %}{{ d.srednia_dostepnosc }}%{% else %}brak pomiarów{% endif %}</b>.
      {% if d.bez_pomiarow %}
      {{ d.bez_pomiarow }} usług nie ma jeszcze pomiarów — to nie to samo co 100%.
      {% endif %}
    </p>

    {{ paski(d.wykres_stanow) }}

    {% if d.niedostepne %}
    <h2 style="font-size:15px; margin:18px 0 8px">Nie odpowiadają</h2>
    <table cellpadding="6" cellspacing="0" border="0" width="100%"
           style="border-collapse:collapse; font-size:13px">
      <tr style="background:#f5f6f8">
        <th align="left" style="border-bottom:1px solid #dcdfe4">Usługa</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Adres</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Przyczyna</th>
      </tr>
      {% for c in d.niedostepne %}
      <tr>
        <td style="border-bottom:1px solid #eef0f3">{{ c.nazwa }}</td>
        <td style="border-bottom:1px solid #eef0f3">{{ c.host }}:{{ c.port }}</td>
        <td style="border-bottom:1px solid #eef0f3; color:#a52222">{{ c.ostatni_blad or 'brak odpowiedzi' }}</td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}

    {% if d.wygasle or d.koncza_sie or d.niezaufane %}
    <h2 style="font-size:15px; margin:18px 0 8px">Certyfikaty wymagające uwagi</h2>
    <table cellpadding="6" cellspacing="0" border="0" width="100%"
           style="border-collapse:collapse; font-size:13px">
      <tr style="background:#f5f6f8">
        <th align="left" style="border-bottom:1px solid #dcdfe4">Usługa</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Wystawca</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Ważny do</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Stan</th>
      </tr>
      {% for c, dni in d.wygasle + d.koncza_sie %}
      <tr>
        <td style="border-bottom:1px solid #eef0f3">{{ c.nazwa }}<br>
          <span style="color:#6b7280; font-size:12px">{{ c.host }}</span></td>
        <td style="border-bottom:1px solid #eef0f3; font-size:12px">{{ c.cert_wystawca or '—' }}</td>
        <td style="border-bottom:1px solid #eef0f3">{{ c.cert_do.strftime('%Y-%m-%d') if c.cert_do else '—' }}</td>
        <td style="border-bottom:1px solid #eef0f3; font-weight:700;
                   color:{% if dni <= c.prog_alarmu_dni %}#a52222{% else %}#8a6100{% endif %}">
          {% if dni < 0 %}wygasł {{ -dni }} dni temu{% else %}za {{ dni }} dni{% endif %}
        </td>
      </tr>
      {% endfor %}
      {% for c, dni in d.niezaufane %}
      <tr>
        <td style="border-bottom:1px solid #eef0f3">{{ c.nazwa }}<br>
          <span style="color:#6b7280; font-size:12px">{{ c.host }}</span></td>
        <td style="border-bottom:1px solid #eef0f3; font-size:12px">{{ c.cert_wystawca or '—' }}</td>
        <td style="border-bottom:1px solid #eef0f3">{{ c.cert_do.strftime('%Y-%m-%d') if c.cert_do else '—' }}</td>
        <td style="border-bottom:1px solid #eef0f3; font-weight:700; color:#a52222">łańcuch niezaufany</td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}

    {% if d.najgorsze %}
    <h2 style="font-size:15px; margin:18px 0 8px">Najniższa dostępność (7 dni)</h2>
    <table cellpadding="6" cellspacing="0" border="0" width="100%"
           style="border-collapse:collapse; font-size:13px">
      <tr style="background:#f5f6f8">
        <th align="left" style="border-bottom:1px solid #dcdfe4">Usługa</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Dostępność</th>
        <th align="left" style="border-bottom:1px solid #dcdfe4">Sprawdzeń</th>
      </tr>
      {% for p in d.najgorsze %}
      <tr>
        <td style="border-bottom:1px solid #eef0f3">{{ p.cel.nazwa }}</td>
        <td style="border-bottom:1px solid #eef0f3; font-weight:700;
                   color:{% if p.okno.procent < 99 %}#a52222{% else %}#1c2024{% endif %}">{{ p.okno.procent }}%</td>
        <td style="border-bottom:1px solid #eef0f3">{{ p.okno.udane }} / {{ p.okno.pomiary }}</td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}

    {% if not d.liczba %}
    <p style="font-size:13px; color:#6b7280">
      Ta firma nie monitoruje jeszcze żadnej usługi. Cel podaje się adresem IP
      albo nazwą na stronie „Monitorowanie usług”.
    </p>
    {% endif %}
  {% endif %}

  {# --- wykorzystanie zasobow --- #}
  {% if raport.rodzaj == 'wykorzystanie' %}
    {% macro dziesiatka(pozycje, tytul, podpis) %}
      {% if pozycje %}
      <h2 style="font-size:15px; margin:22px 0 6px">{{ tytul }}</h2>
      <p style="margin:0 0 8px; font-size:11px; color:#6b7280">{{ podpis }}</p>
      <table cellpadding="5" cellspacing="0" border="0" width="100%"
             style="border-collapse:collapse; font-size:13px">
        {% for p in pozycje %}
        <tr>
          <td style="border-bottom:1px solid #eef0f3; width:26%">{{ p.maszyna.hostname }}</td>
          <td style="border-bottom:1px solid #eef0f3; width:16%" align="right">
            <b style="color:{% if p.alarm %}#a52222{% elif p.uwaga %}#8a6100{% else %}#1c2024{% endif %}">
              {{ p.wartosc }} {{ p.jednostka }}</b>
          </td>
          <td style="border-bottom:1px solid #eef0f3; color:#6b7280; font-size:12px">
            {{ p.opis }}
          </td>
        </tr>
        {% endfor %}
      </table>
      {% endif %}
    {% endmacro %}

    <p style="margin:0 0 14px; font-size:13px; color:#6b7280">
      Zbadano {{ d.zbadanych }} maszyn. Każde zestawienie pokazuje najwyżej
      dziesięć pozycji — lista, która nie mieści się na ekranie, przestaje być
      lista rzeczy do zrobienia.
    </p>

    {{ dziesiatka(d.pamiec, 'Najwieksze zajecie pamieci',
       'Stan w chwili raportu. Wyroznione powyzej ' ~ d.prog_uwagi ~ '%.') }}
    {{ dziesiatka(d.dyski, 'Najpelniejsze dyski',
       'Najbardziej zapelniony wolumen kazdej maszyny - nie srednia, bo pelny dysk systemowy i pusty dysk danych to nie jest polowa problemu.') }}
    {{ dziesiatka(d.procesor, 'Najwieksze obciazenie procesora',
       'Uwaga: obciazenie to tempo, a agent raportuje raz na kilka godzin. Na Linuksie jest to srednia z 15 minut, na Windows probka z chwili raportu.') }}
    {{ dziesiatka(d.podatnosci, 'Najwiecej podatnosci do zrobienia',
       'Podatnosci z dostepna poprawka - czyli te, na ktore mozna zareagowac.') }}
    {{ dziesiatka(d.aktualizacje, 'Najwiecej brakujacych aktualizacji',
       'Wedlug menedzera pakietow albo uslugi Windows Update.') }}
    {{ dziesiatka(d.restarty, 'Najdluzej bez ponownego uruchomienia',
       'Powyzej ' ~ d.dni_bez_restartu ~ ' dni. Czesc poprawek jadra i bibliotek zaczyna dzialac dopiero po restarcie.') }}
    {{ dziesiatka(d.administratorzy, 'Najwiecej kont administratorow',
       'Konta z uprawnieniami administratora lokalnego - im wiecej, tym szersza powierzchnia ataku.') }}

    {% if d.bez_kontaktu %}
    <h2 style="font-size:15px; margin:22px 0 6px">Bez kontaktu</h2>
    <p style="margin:0 0 8px; font-size:11px; color:#6b7280">
      Dla tych maszyn dane są nieaktualne — zestawienia powyżej ich nie opisują.
    </p>
    <table cellpadding="5" cellspacing="0" border="0" width="100%"
           style="border-collapse:collapse; font-size:13px">
      {% for p in d.bez_kontaktu %}
      <tr>
        <td style="border-bottom:1px solid #eef0f3; width:26%">{{ p.maszyna.hostname }}</td>
        <td style="border-bottom:1px solid #eef0f3" align="right">
          <b style="color:#a52222">{{ p.wartosc }} {{ p.jednostka }}</b>
        </td>
        <td style="border-bottom:1px solid #eef0f3; color:#6b7280; font-size:12px">{{ p.opis }}</td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}
  {% endif %}

  {% if raport.wiersze and raport.kolumny %}
  <h2 style="font-size:15px; margin:24px 0 8px">Maszyny ({{ raport.wiersze | length }})</h2>
  <table cellpadding="6" cellspacing="0" border="0" width="100%"
         style="border-collapse:collapse; font-size:12px">
    <tr style="background:#f5f6f8">
      {% for k in raport.kolumny %}
        <th align="{% if k.typ == 'liczba' %}right{% else %}left{% endif %}"
            style="border-bottom:1px solid #dcdfe4; white-space:nowrap">{{ k.etykieta }}</th>
      {% endfor %}
    </tr>
    {% for w in raport.wiersze %}
    <tr>
      {% for c in w.komorki %}
        <td align="{% if c.kolumna.typ == 'liczba' %}right{% else %}left{% endif %}"
            style="border-bottom:1px solid #eef0f3;
            {% if c.kolumna.alarm and c.wartosc %}color:#a52222; font-weight:700{% endif %}">
          {% if c.wartosc is none or c.wartosc == '' %}
            <span style="color:#b6bcc6">—</span>
          {% else %}{{ c.wartosc }}{% endif %}
        </td>
      {% endfor %}
    </tr>
    {% endfor %}
  </table>
  {% endif %}

  <p style="margin:26px 0 0; padding-top:12px; border-top:1px solid #dcdfe4;
            font-size:11px; color:#6b7280">
    Raport wygenerowany automatycznie przez CMDB. Nie odpowiadaj na te wiadomość.
  </p>
</div>
