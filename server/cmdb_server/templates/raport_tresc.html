{#
  Tresc raportu w panelu.

  Osobno od raport.html, bo wiadomosc i strona maja rozne ograniczenia.
  Klient poczty wycina sekcje <style> i nie renderuje SVG, wiec tam zostaja
  tabele ze stylem wpisanym w atrybuty. Przegladarka nie ma zadnego z tych
  ograniczen, wiec dostaje prawdziwe wykresy kolowe i wspolny arkusz stylow -
  ten sam, ktory zna motyw ciemny.

  Liczby pochodza z tego samego zrodla co w wiadomosci; rozni sie wylacznie
  sposob narysowania.
#}

{% macro pierscien(dane, tytul, jednostka) %}
  {% if dane.segmenty %}
  <section class="wykres-blok">
    <h3>{{ tytul }}</h3>
    <div class="wykres-uklad">
      <svg class="wykres-kolowy" viewBox="0 0 {{ dane.bok }} {{ dane.bok }}"
           role="img" aria-label="{{ tytul }}">
        <g transform="rotate(-90 {{ dane.srodek }} {{ dane.srodek }})">
          {% for s in dane.segmenty %}
          <circle cx="{{ dane.srodek }}" cy="{{ dane.srodek }}" r="{{ dane.promien }}"
                  fill="none" stroke="{{ s.barwa }}" stroke-width="{{ dane.grubosc }}"
                  stroke-dasharray="{{ s.dasharray }}"
                  stroke-dashoffset="{{ s.dashoffset }}">
            <title>{{ s.etykieta }}: {{ s.wartosc }} ({{ s.udzial }}%)</title>
          </circle>
          {% endfor %}
        </g>
        <text x="{{ dane.srodek }}" y="{{ dane.srodek - 2 }}"
              class="wykres-suma">{{ dane.suma }}</text>
        <text x="{{ dane.srodek }}" y="{{ dane.srodek + 16 }}"
              class="wykres-jednostka">{{ jednostka }}</text>
      </svg>

      <table class="table wykres-legenda">
        <thead>
          <tr><th></th><th>Pozycja</th><th class="lp">Liczba</th><th class="lp">Udzial</th></tr>
        </thead>
        <tbody>
        {% for s in dane.segmenty %}
          <tr>
            <td class="lp-barwa"><span class="probka" style="background:{{ s.barwa }}"></span></td>
            <td>{{ s.etykieta }}</td>
            <td class="lp strong">{{ s.wartosc }}</td>
            <td class="lp muted">{{ s.udzial }}%</td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </section>
  {% endif %}
{% endmacro %}

{% macro kafelek(wartosc, opis, alarm=false) %}
  <div class="kafelek {% if alarm and wartosc %}kafelek-alarm{% endif %}">
    <div class="kafelek-wartosc">{{ wartosc }}</div>
    <div class="kafelek-opis">{{ opis }}</div>
  </div>
{% endmacro %}

{% set d = raport.dane %}

{# --- podatnosci --- #}
{% if raport.rodzaj == 'podatnosci' %}
  <div class="kafelki">
    {{ kafelek(d.powazne, 'powazne (CVSS >= 7) z gotowa poprawka', true) }}
    {{ kafelek(d.do_zrobienia, 'wszystkie do zrobienia') }}
    {{ kafelek(d.bez_poprawki, 'znane, bez dostepnej poprawki') }}
  </div>

  {{ pierscien(wykresy.z_paskow(d.wykres_wagi, wykresy.PALETA_WAGI),
               'Podzial wedlug wagi', 'podatnosci') }}

  {% if d.najgorsze %}
  <section class="wykres-blok">
    <h3>Maszyny wymagajace uwagi</h3>
    <table class="table">
      <thead>
        <tr><th>Maszyna</th><th class="lp">Poważne</th>
            <th class="lp">Do zrobienia</th><th class="lp">Bez poprawki</th></tr>
      </thead>
      <tbody>
      {% for w in d.najgorsze %}
        <tr>
          <td class="strong">{{ w.maszyna.hostname }}</td>
          <td class="lp {% if w.wynik.critical_count %}wartosc-alarm{% endif %}">
            {{ w.wynik.critical_count }}</td>
          <td class="lp">{{ w.wynik.fixable_count }}</td>
          <td class="lp">{{ w.wynik.open_count }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% endif %}

  {% if d.nieznane %}
  <p class="uwaga-raportu">
    Dla {{ d.nieznane | length }} maszyn nie znamy stanu podatności - to nie
    znaczy, że są bezpieczne, tylko że nie udało się ich sprawdzić.
  </p>
  {% endif %}

{# --- sprzet --- #}
{% elif raport.rodzaj == 'sprzet' %}
  <div class="kafelki">
    {{ kafelek(d.liczba, 'maszyn w ewidencji') }}
    {{ kafelek(d.bez_kontaktu, 'bez kontaktu ponad 48 h', true) }}
    {{ kafelek(d.bez_opiekuna, 'bez przypisanego opiekuna') }}
  </div>

  {{ pierscien(wykresy.z_paskow(d.wykres_systemy), 'System operacyjny', 'maszyn') }}
  {{ pierscien(wykresy.z_paskow(d.wykres_producenci), 'Producent', 'maszyn') }}
  {{ pierscien(wykresy.z_paskow(d.wykres_agenci), 'Wersja agenta', 'maszyn') }}

{# --- gwarancje --- #}
{% elif raport.rodzaj == 'gwarancje' %}
  <div class="kafelki">
    {{ kafelek(d.po_terminie | length, 'gwarancja juz wygasla', true) }}
    {{ kafelek(d.koncza_sie | length, 'konczy sie w ' ~ d.horyzont ~ ' dni', true) }}
    {{ kafelek(d.na_gwarancji, 'objetych wsparciem') }}
  </div>

  {{ pierscien(wykresy.z_paskow(d.wykres), 'Stan gwarancji', 'maszyn') }}

  {% if d.koncza_sie %}
  <section class="wykres-blok">
    <h3>Kończy się w najbliższych {{ d.horyzont }} dniach</h3>
    <table class="table">
      <thead><tr><th>Maszyna</th><th>Model</th><th>Dostawca</th><th>Gwarancja do</th></tr></thead>
      <tbody>
      {% for m in d.koncza_sie %}
        <tr>
          <td class="strong">{{ m.hostname }}</td>
          <td>{{ m.model or '-' }}</td>
          <td>{% if m.dostawca %}{{ m.dostawca.wartosc }}{% else %}-{% endif %}</td>
          <td class="strong">{{ m.warranty_until }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% endif %}

  {% if d.po_terminie %}
  <section class="wykres-blok">
    <h3>Po terminie</h3>
    <table class="table">
      <thead><tr><th>Maszyna</th><th>Model</th><th>Wygasła</th></tr></thead>
      <tbody>
      {% for m in d.po_terminie[:40] %}
        <tr>
          <td class="strong">{{ m.hostname }}</td>
          <td>{{ m.model or '-' }}</td>
          <td class="wartosc-alarm">{{ m.warranty_until }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% endif %}

  {% if d.bez_danych %}
  <p class="uwaga-raportu">
    {{ d.bez_danych | length }} maszyn nie ma wpisanej daty gwarancji. Brak daty
    nie znaczy, że gwarancji nie ma - znaczy, że nikt jej nie uzupełnił.
  </p>
  {% endif %}

{# --- dostepnosc uslug i certyfikaty --- #}
{% elif raport.rodzaj == 'uslugi' %}
  <div class="kafelki">
    {{ kafelek(d.niedostepne | length, 'usług nie odpowiada', true) }}
    {{ kafelek(d.wygasle | length, 'certyfikatów po terminie', true) }}
    {{ kafelek(d.koncza_sie | length, 'certyfikatów kończy się wkrótce', true) }}
  </div>

  <p class="uwaga-raportu">
    Monitorowanych usług: <b>{{ d.liczba }}</b>.
    Średnia dostępność z ostatnich 7 dni:
    <b>{% if d.srednia_dostepnosc is not none %}{{ d.srednia_dostepnosc }}%{% else %}brak pomiarów{% endif %}</b>.
    {% if d.bez_pomiarow %}
    {{ d.bez_pomiarow }} usług nie ma jeszcze pomiarów — brak pomiarów to nie to samo co 100%.
    {% endif %}
  </p>

  {{ pierscien(wykresy.z_paskow(d.wykres_stanow), 'Stan monitorowanych usług', 'usług') }}

  {% if d.niedostepne %}
  <section class="wykres-blok">
    <h3>Nie odpowiadają</h3>
    <table class="table">
      <thead><tr><th>Usługa</th><th>Adres</th><th>Przyczyna</th><th>Od</th></tr></thead>
      <tbody>
      {% for c in d.niedostepne %}
        <tr>
          <td class="strong">{{ c.nazwa }}</td>
          <td class="small">{{ c.host }}:{{ c.port }} <span class="muted">{{ c.protokol | upper }}</span></td>
          <td class="wartosc-alarm small">{{ c.ostatni_blad or 'brak odpowiedzi' }}</td>
          <td class="small">{{ c.ostatnia_zmiana_stanu | dt }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% endif %}

  {% if d.milczace %}
  <section class="wykres-blok">
    <h3>Bez raportów agenta</h3>
    <p class="muted small">
      Agent przestał przysyłać wyniki. To nie jest awaria usługi ani jej
      sprawność — to brak wiedzy, i naprawia się go przy agencie.
    </p>
    <table class="table">
      <thead><tr><th>Usługa</th><th>Sprawdza</th><th>Ostatni raport</th></tr></thead>
      <tbody>
      {% for c in d.milczace %}
        <tr>
          <td class="strong">{{ c.nazwa }}<div class="muted small">{{ c.host }}:{{ c.port }}</div></td>
          <td class="small">{{ c.wykonawca.hostname if c.wykonawca else '-' }}</td>
          <td class="small wartosc-uwaga">{{ c.ostatni_raport | dt }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% endif %}

  {% if d.wygasle or d.koncza_sie or d.niezaufane %}
  <section class="wykres-blok">
    <h3>Certyfikaty wymagające uwagi</h3>
    <table class="table">
      <thead><tr><th>Usługa</th><th>Wystawca</th><th>Ważny do</th><th>Stan</th></tr></thead>
      <tbody>
      {% for c, dni in d.wygasle + d.koncza_sie %}
        <tr>
          <td class="strong">{{ c.nazwa }}<div class="muted small">{{ c.host }}</div></td>
          <td class="small">{{ c.cert_wystawca or '-' }}</td>
          <td class="small">{{ c.cert_do.strftime('%Y-%m-%d') if c.cert_do else '-' }}</td>
          <td class="strong {% if dni <= c.prog_alarmu_dni %}wartosc-alarm{% else %}wartosc-uwaga{% endif %}">
            {% if dni < 0 %}wygasł {{ -dni }} dni temu{% else %}za {{ dni }} dni{% endif %}
          </td>
        </tr>
      {% endfor %}
      {% for c, dni in d.niezaufane %}
        <tr>
          <td class="strong">{{ c.nazwa }}<div class="muted small">{{ c.host }}</div></td>
          <td class="small">{{ c.cert_wystawca or '-' }}</td>
          <td class="small">{{ c.cert_do.strftime('%Y-%m-%d') if c.cert_do else '-' }}</td>
          <td class="strong wartosc-alarm">łańcuch niezaufany</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% endif %}

  {% if d.najgorsze %}
  <section class="wykres-blok">
    <h3>Najniższa dostępność (7 dni)</h3>
    <table class="table">
      <thead><tr><th>Usługa</th><th class="lp">Dostępność</th><th class="lp">Sprawdzeń</th></tr></thead>
      <tbody>
      {% for p in d.najgorsze %}
        <tr>
          <td class="strong">{{ p.cel.nazwa }}<div class="muted small">{{ p.cel.host }}:{{ p.cel.port }}</div></td>
          <td class="lp strong {% if p.okno.procent < 99 %}wartosc-alarm{% endif %}">{{ p.okno.procent }}%</td>
          <td class="lp muted">{{ p.okno.udanych }} / {{ p.okno.sond }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% endif %}

  {% if not d.liczba %}
  <p class="uwaga-raportu">
    Ta firma nie monitoruje jeszcze żadnej usługi. Cel podaje się adresem IP
    albo nazwą na stronie <a href="/monitoring">Monitorowanie usług</a>.
  </p>
  {% endif %}

{# --- wykorzystanie zasobow --- #}
{% elif raport.rodzaj == 'wykorzystanie' %}
  {% macro dziesiatka(pozycje, tytul, podpis) %}
    {% if pozycje %}
    <section class="wykres-blok">
      <h3>{{ tytul }}</h3>
      <p class="muted small">{{ podpis }}</p>
      <table class="table">
        <tbody>
        {% for p in pozycje %}
          <tr>
            <td class="strong nazwa-maszyny">{{ p.maszyna.hostname }}</td>
            <td class="lp wartosc-zestawienia">
              <b class="{% if p.alarm %}wartosc-alarm{% elif p.uwaga %}wartosc-uwaga{% endif %}">
                {{ p.wartosc }} {{ p.jednostka }}</b>
            </td>
            <td>
              {% if p.jednostka == '%' %}
              <span class="pasek"><span
                class="pasek-wypelnienie{% if p.alarm %} pasek-alarm{% elif p.uwaga %} pasek-uwaga{% endif %}"
                style="width:{{ p.wartosc }}%"></span></span>
              {% endif %}
              <span class="muted small">{{ p.opis }}</span>
            </td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </section>
    {% endif %}
  {% endmacro %}

  <p class="muted">
    Zbadano {{ d.zbadanych }} maszyn. Każde zestawienie pokazuje najwyżej
    dziesięć pozycji - lista, która nie mieści się na ekranie, przestaje być
    lista rzeczy do zrobienia.
  </p>

  {{ dziesiatka(d.pamiec, 'Najwieksze zajecie pamieci',
     'Stan w chwili raportu. Wyroznione powyzej ' ~ d.prog_uwagi ~ '%.') }}
  {{ dziesiatka(d.dyski, 'Najpelniejsze dyski',
     'Najbardziej zapelniony wolumen kazdej maszyny - nie srednia, bo pelny dysk systemowy i pusty dysk danych to nie jest polowa problemu.') }}
  {{ dziesiatka(d.procesor, 'Najwieksze obciazenie procesora',
     'Uwaga: obciazenie to tempo, a agent raportuje raz na kilka godzin. Na Linuksie jest to srednia z 15 minut, na Windows probka z chwili raportu.') }}
  {{ dziesiatka(d.podatnosci, 'Najwiecej podatnosci do zrobienia',
     'Podatnosci z dostepna poprawka - czyli te, na ktore mozna zareagowac.') }}
  {{ dziesiatka(d.aktualizacje, 'Najwiecej brakujacych aktualizacji',
     'Wedlug menedzera pakietow albo uslugi Windows Update.') }}
  {{ dziesiatka(d.restarty, 'Najdluzej bez ponownego uruchomienia',
     'Powyzej ' ~ d.dni_bez_restartu ~ ' dni. Czesc poprawek jadra i bibliotek zaczyna dzialac dopiero po restarcie.') }}
  {{ dziesiatka(d.administratorzy, 'Najwiecej kont administratorow',
     'Konta z uprawnieniami administratora lokalnego - im wiecej, tym szersza powierzchnia ataku.') }}

  {% if d.bez_kontaktu %}
  <section class="wykres-blok">
    <h3>Bez kontaktu</h3>
    <p class="muted small">
      Dla tych maszyn dane są nieaktualne - zestawienia powyżej ich nie opisują.
    </p>
    <table class="table">
      <tbody>
      {% for p in d.bez_kontaktu %}
        <tr>
          <td class="strong nazwa-maszyny">{{ p.maszyna.hostname }}</td>
          <td class="lp wartosc-zestawienia">
            <b class="wartosc-alarm">{{ p.wartosc }} {{ p.jednostka }}</b></td>
          <td class="muted small">{{ p.opis }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% endif %}

{# --- brakujace aktualizacje --- #}
{% elif raport.rodzaj == 'aktualizacje' %}
  <div class="kafelki">
    {{ kafelek(d.bezpieczenstwa, 'poprawek bezpieczeństwa czeka', true) }}
    {{ kafelek(d.czekajace, 'wszystkich aktualizacji czeka') }}
    {{ kafelek(d.aktualne, 'maszyn nic nie potrzebuje') }}
    {{ kafelek(d.nieznane | length, 'maszyn o nieznanym stanie', true) }}
  </div>

  <p class="muted">
    Aktualizacja to nie to samo co podatność. Podatność mówi, co grozi;
    aktualizacja — co da się zainstalować dzisiaj. Maszyna bez ani jednego
    znanego CVE może mieć kilkadziesiąt zaległych poprawek.
  </p>

  {{ pierscien(wykresy.z_paskow(d.wykres), 'Stan aktualizacji', 'maszyn') }}
  {% if d.wykres_zrodla %}
    {{ pierscien(wykresy.z_paskow(d.wykres_zrodla), 'Źródło danych', 'maszyn') }}
  {% endif %}

  {% if d.z_bezpieczenstwem %}
  <section class="wykres-blok">
    <h3>Czekają poprawki bezpieczeństwa</h3>
    <p class="muted small">Od tych maszyn zaczyna się pracę.</p>
    <table class="table">
      <thead><tr><th>Maszyna</th><th class="lp">Bezpieczeństwa</th><th class="lp">Wszystkich</th><th>Źródło</th></tr></thead>
      <tbody>
      {% for w in d.z_bezpieczenstwem %}
        <tr>
          <td class="strong nazwa-maszyny">{{ w.maszyna.hostname }}</td>
          <td class="lp"><b class="wartosc-alarm">{{ w.bezpieczenstwa }}</b></td>
          <td class="lp">{{ w.czekajace }}</td>
          <td class="muted small">{{ w.zrodlo or '-' }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% endif %}

  {% if d.ze_zwyklymi %}
  <section class="wykres-blok">
    <h3>Czekają zwykłe aktualizacje</h3>
    <table class="table">
      <thead><tr><th>Maszyna</th><th class="lp">Czeka</th><th>Źródło</th></tr></thead>
      <tbody>
      {% for w in d.ze_zwyklymi %}
        <tr>
          <td class="strong nazwa-maszyny">{{ w.maszyna.hostname }}</td>
          <td class="lp"><b class="wartosc-uwaga">{{ w.czekajace }}</b></td>
          <td class="muted small">{{ w.zrodlo or '-' }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% endif %}

  {% if d.nieswieze %}
  <p class="uwaga-raportu">
    Na {{ d.nieswieze | length }} maszynach indeks pakietów jest starszy niż
    {{ d.prog_indeksu }} godzin — liczby powyżej mogą być zaniżone. Agent
    celowo nie odświeża indeksu: ma maszynę opisywać, a nie zmieniać jej stan.
  </p>
  {% endif %}

  {% if d.nieznane %}
  <section class="wykres-blok">
    <h3>Stan nieznany ({{ d.nieznane | length }})</h3>
    <p class="muted small">
      Brak odpowiedzi to nie to samo co brak aktualizacji.
    </p>
    <table class="table">
      <tbody>
      {% for w in d.nieznane[:40] %}
        <tr>
          <td class="strong nazwa-maszyny">{{ w.maszyna.hostname }}</td>
          <td class="muted small">{{ w.powod }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
  {% endif %}
{% endif %}

{% if raport.wiersze and raport.kolumny %}
<section class="wykres-blok">
  <h3>Maszyny ({{ raport.wiersze | length }})</h3>
  <div class="tabela-przewijana">
    <table class="table">
      <thead>
        <tr>
          {% for k in raport.kolumny %}
            <th class="{% if k.typ == 'liczba' %}lp{% endif %}">{{ k.etykieta }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody>
      {% for w in raport.wiersze %}
        <tr>
          {% for c in w.komorki %}
            <td class="{% if c.kolumna.typ == 'liczba' %}lp {% endif %}{% if c.kolumna.alarm and c.wartosc %}wartosc-alarm{% endif %}">
              {% if c.wartosc is none or c.wartosc == '' %}
                <span class="muted">-</span>
              {% else %}{{ c.wartosc }}{% endif %}
            </td>
          {% endfor %}
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endif %}
