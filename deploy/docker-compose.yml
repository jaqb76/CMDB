# Uruchomienie: skopiuj .env.example do .env, uzupelnij, potem `docker compose up -d`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmdb}
      POSTGRES_USER: ${POSTGRES_USER:-cmdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w pliku .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmdb} -d ${POSTGRES_DB:-cmdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    # Baza nie jest wystawiona na zewnatrz - dostep tylko z sieci kontenerow.
    expose:
      - "5432"

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Ustaw przy budowaniu, np.:
        #   CMDB_WERSJA=$(git log -1 --format='%h (%cs)') docker compose build
        # Bez tego stopka powie "nieznana" - i to jest uczciwe, bo numer
        # wzięty z powietrza kazałby uznać poprawkę za wdrożoną.
        CMDB_WERSJA: ${CMDB_WERSJA:-nieznana}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CMDB_ENV: prod
      FORWARDED_ALLOW_IPS: ${CMDB_PROXY_IP:-172.30.77.10}
      CMDB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cmdb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cmdb}
      CMDB_SECRET_KEY: ${CMDB_SECRET_KEY:?ustaw CMDB_SECRET_KEY w pliku .env}
      CMDB_REQUIRE_HTTPS: "true"
      CMDB_STALE_AFTER_HOURS: ${CMDB_STALE_AFTER_HOURS:-48}
      CMDB_SNAPSHOT_RETENTION: ${CMDB_SNAPSHOT_RETENTION:-50}
      CMDB_REPORT_INTERVAL_SECONDS: ${CMDB_REPORT_INTERVAL_SECONDS:-3600}
      CMDB_LOG_LEVEL: ${CMDB_LOG_LEVEL:-INFO}
      # Out-of-band catalog of tested Windows builds; empty means deny.
      CMDB_TRUSTED_WINDOWS_BUILDS: "${CMDB_TRUSTED_WINDOWS_BUILDS:-null}"
      CMDB_RELEASE_IMPORT_ENABLED: ${CMDB_RELEASE_IMPORT_ENABLED:-false}
      CMDB_RELEASE_REPOSITORY: ${CMDB_RELEASE_REPOSITORY:-jaqb76/CMDB}
      CMDB_RELEASE_REF: ${CMDB_RELEASE_REF:-refs/heads/claude/os-data-collection-agent-gfz2o8}
      CMDB_RELEASE_PUBLIC_KEYS: "${CMDB_RELEASE_PUBLIC_KEYS:-null}"
      CMDB_RELEASE_GITHUB_TOKEN: ${CMDB_RELEASE_GITHUB_TOKEN:-}
      CMDB_RELEASE_IMPORT_INTERVAL: ${CMDB_RELEASE_IMPORT_INTERVAL:-300}
      CMDB_LOGIN_MAX_FAILURES: ${CMDB_LOGIN_MAX_FAILURES:-3}
      CMDB_LOGIN_LOCKOUT_HOURS: ${CMDB_LOGIN_LOCKOUT_HOURS:-24}
      # Bez klucza pobieranie ocen CVSS dziala, tylko wolniej (5 zapytan / 30 s).
      CMDB_NVD_API_KEY: ${CMDB_NVD_API_KEY:-}
      # Monitorowanie uslug: sonduje AGENT na maszynie klienta, nie ten
      # kontener. Serwer wydaje polityke, przyjmuje wyniki i powiadamia, wiec
      # nie musi widziec monitorowanych adresow. Wylaczenie zostawia
      # konfiguracje w bazie i przestaje wydawac polityke - agenci przestaja
      # dostawac cele. Przydaje sie na instalacji zapasowej.
      CMDB_MONITORING_ENABLED: ${CMDB_MONITORING_ENABLED:-true}
      # Co ile agent ma przysylac podsumowanie. Awarie ida osobno i od razu,
      # wiec to odstep wylacznie dla potwierdzen, ze wszystko dziala.
      CMDB_MONITORING_REPORT_SECONDS: ${CMDB_MONITORING_REPORT_SECONDS:-900}
      CMDB_MONITORING_MAX_TARGETS: ${CMDB_MONITORING_MAX_TARGETS:-200}
      CMDB_MONITORING_MAX_PER_AGENT: ${CMDB_MONITORING_MAX_PER_AGENT:-50}
      CMDB_MONITORING_HISTORY_DAYS: ${CMDB_MONITORING_HISTORY_DAYS:-90}
      # Cel pod adresem petli zwrotnej znaczy "maszyna agenta". Bywa to
      # sensowne (usluga na tej samej maszynie), ale nie domyslnie.
      CMDB_MONITORING_ALLOW_LOOPBACK: ${CMDB_MONITORING_ALLOW_LOOPBACK:-false}
      # Adres, pod ktorym klienci widza serwer - trafia do wydawanego skryptu
      # instalacyjnego. Za proxy nie da sie go wiarygodnie odgadnac z zadania.
      CMDB_PUBLIC_URL: ${CMDB_PUBLIC_URL:?ustaw CMDB_PUBLIC_URL, np. https://cmdb.firma.pl}
    volumes:
      # Wgrane wersje agenta musza przezyc odtworzenie kontenera - bez tego
      # znikaja, a wskazania wersji oficjalnej zostaja bez plikow.
      - releases:/app/releases
    expose:
      - "8000"

    networks: [backend, ingress]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/cmdb.conf:/etc/nginx/conf.d/default.conf:ro
      # Umiesc tu fullchain.pem i privkey.pem (Let's Encrypt albo wewnetrzne PKI).
      - ./certs:/etc/nginx/certs:ro
    networks:
      ingress:
        ipv4_address: ${CMDB_PROXY_IP:-172.30.77.10}

networks:
  backend:
    internal: true
  ingress:
    ipam:
      config:
        - subnet: ${CMDB_PROXY_SUBNET:-172.30.77.0/24}

volumes:
  pgdata:
  releases:
