# Zakonczenie TLS przed serwerem CMDB.
# Certyfikaty: /etc/nginx/certs/fullchain.pem oraz privkey.pem

# Rozmiar raportu: agent wysyla gzipem, ale zostawiamy zapas.
client_max_body_size 12m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME (Let's Encrypt) bez przekierowania.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Tylko nowoczesne wersje TLS - agenty sa nasze, nie musimy wspierac starych klientow.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:CMDB:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/cmdb-access.log;
    error_log  /var/log/nginx/cmdb-error.log warn;

    location / {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Bez tego naglowka serwer uznalby polaczenie za nieszyfrowane i odrzucil raporty.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Raporty ida w calosci do aplikacji - buforowanie tylko opoznia.
        proxy_request_buffering off;
    }
}
