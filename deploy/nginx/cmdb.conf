# Zakonczenie TLS przed serwerem CMDB.
# Certyfikaty: /etc/nginx/certs/fullchain.pem oraz privkey.pem

# Rozmiar raportu: agent wysyla gzipem, ale zostawiamy zapas.
client_max_body_size 12m;

# Limity zapytan. Serwer wystawiony do internetu dostaje staly ruch skanerow
# szukajacych PHP i WordPressa - same 404, ale kazde przechodzi przez aplikacje.
#
# Odstepy sa dobrane pod faktyczny ruch: agent raportuje raz na kilka godzin,
# a czlowiek klika najwyzej kilka razy na sekunde. Nawet ciasny limit nie ma
# jak przeszkodzic normalnemu uzyciu.
limit_req_zone $binary_remote_addr zone=cmdb_ogolny:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cmdb_logowanie:10m rate=6r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=cmdb_polaczenia:10m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME (Let's Encrypt) bez przekierowania.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Tylko nowoczesne wersje TLS - agenty sa nasze, nie musimy wspierac starych klientow.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:CMDB:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/cmdb-access.log;
    error_log  /var/log/nginx/cmdb-error.log warn;

    # Skanery. Aplikacja nie serwuje PHP ani WordPressa, wiec kazde takie
    # zapytanie jest z definicji obce - odcinamy je tutaj, zamiast pozwalac im
    # przechodzic przez aplikacje po odpowiedz 404. Kod 444 zamyka polaczenie
    # bez odpowiedzi: skaner nie dostaje nawet potwierdzenia, ze cos tu stoi.
    location ~* \.(php|asp|aspx|jsp|cgi)$ { access_log off; return 444; }
    location ~* ^/(wp-|wordpress|xmlrpc|phpmyadmin|pma|adminer|cgi-bin|vendor/|\.env|\.git) {
        access_log off;
        return 444;
    }

    # Logowanie ma wlasny, ciasny limit - to jedyne miejsce, gdzie zgadywanie
    # ma sens. Wlasciwa blokada konta jest w aplikacji, ale odsiewanie tutaj
    # oszczedza jej samego sprawdzania.
    location = /login {
        limit_req zone=cmdb_logowanie burst=3 nodelay;
        limit_conn cmdb_polaczenia 10;

        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=cmdb_ogolny burst=40 nodelay;
        limit_conn cmdb_polaczenia 20;

        proxy_pass http://server:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Bez tego naglowka serwer uznalby polaczenie za nieszyfrowane i odrzucil raporty.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Raporty ida w calosci do aplikacji - buforowanie tylko opoznia.
        proxy_request_buffering off;
    }
}
