# Instancja testowa pod wlasna nazwa, obslugiwana przez TEN SAM nginx co
# produkcja. Porty 80 i 443 moze trzymac tylko jeden proces, wiec drugiego
# proxy nie ma - jest drugi blok server rozpoznawany po nazwie.
#
# Wlaczenie: domontuj ten plik do kontenera proxy obok cmdb.conf
#
#   volumes:
#     - ./nginx/cmdb.conf:/etc/nginx/conf.d/default.conf:ro
#     - ./nginx/cmdb-dev.conf:/etc/nginx/conf.d/cmdb-dev.conf:ro
#
# Blok produkcyjny zostaje domyslnym (server_name _), wiec przejmuje wszystko,
# co nie pasuje tutaj. Kolejnosc plikow nie ma znaczenia - nginx wybiera po
# nazwie, nie po kolejnosci.
#
# Adres "cmdb-dev" to alias kontenera serwera instancji testowej w sieci
# wejsciowej (docker-compose.dev.yml). Nie jest to nazwa uslugi ani kontenera:
# tamte zawieraja nazwe projektu i zmienialyby sie razem z katalogiem.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cmdb-dev.newcenter.pl;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/cmdb-dev-access.log;
    error_log  /var/log/nginx/cmdb-dev-error.log warn;

    # Ten sam rozmiar co na produkcji: instancja testowa sluzy do sprawdzania
    # tego, co pojdzie na produkcje, wiec limity musza byc takie same. Inaczej
    # bledy 413 wychodzilyby dopiero po wdrozeniu.
    client_max_body_size 12m;

    location ~* \.(php|asp|aspx|jsp|cgi)$ { access_log off; return 444; }
    location ~* ^/(wp-|wordpress|xmlrpc|phpmyadmin|pma|adminer|cgi-bin|vendor/|\.env|\.git) {
        access_log off;
        return 444;
    }

    location /admin/releases {
        client_max_body_size 160m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://cmdb-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/mobilna {
        client_max_body_size 160m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://cmdb-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/kopie/przywroc {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_pass http://cmdb-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/admin/kopie/.+/pobierz$ {
        proxy_buffering off;
        proxy_read_timeout 600s;

        proxy_pass http://cmdb-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login {
        limit_req zone=cmdb_logowanie burst=3 nodelay;
        limit_conn cmdb_polaczenia 10;

        proxy_pass http://cmdb-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=cmdb_ogolny burst=40 nodelay;
        limit_conn cmdb_polaczenia 20;

        proxy_pass http://cmdb-dev:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
