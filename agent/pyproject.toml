[project]
name = "cmdb-agent"
version = "0.5.9"
description = "Agent inwentaryzacyjny CMDB - zbiera dane o sprzecie, oprogramowaniu i uzytkownikach"
requires-python = ">=3.9"
# Swiadomie zero zaleznosci: agent ma dzialac na kazdej maszynie klienta
# i pakowac sie do jednego pliku .exe bez ciagniecia bibliotek.
dependencies = []

[project.optional-dependencies]
# Interfejs graficzny jest opcjonalny: pip install -e ".[gui]"
gui = ["pystray>=0.19", "Pillow>=10.0"]

[project.scripts]
cmdb-agent = "cmdb_agent.main:main"
cmdb-agent-tray = "cmdb_agent.main:main_tray"

[tool.setuptools]
packages = ["cmdb_agent", "cmdb_agent.collectors", "cmdb_agent.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
