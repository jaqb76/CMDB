name: CMDB Android build
on:
  workflow_dispatch:
  push:
    branches: ["claude/os-data-collection-agent-gfz2o8"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Domyslnie akcja instaluje pakiety "tools platform-tools". Pakiet "tools"
      # zostal wycofany z repozytorium Google i sdkmanager konczy sie bledem
      # "Failed to find package 'tools'", zanim cokolwiek sie zbuduje. Do
      # budowania APK wystarcza platform-tools; reszte SDK ma juz obraz runnera.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CMDB-Mobile-debug-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # Kazdy APK to ~19 MB, a domyslnie lezy 90 dni. Przy kilkunastu
          # przebiegach konto wyczerpuje limit miejsca na artefakty i wysylka
          # konczy sie bledem "Artifact storage quota has been hit" - APK
          # zbudowany, ale nie do pobrania. Dwa tygodnie wystarczaja na test
          # wydania, a stare buildy przestaja zajmowac miejsce same.
          retention-days: 14

