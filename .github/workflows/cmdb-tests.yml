name: CMDB regression tests
on:
  push:
    branches: ["claude/os-data-collection-agent-gfz2o8"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cmdb
          POSTGRES_PASSWORD: cmdb
          POSTGRES_DB: cmdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cmdb -d cmdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: server
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
        working-directory: agent

  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests/test_discovery.py tests/test_tray_startup.py
        working-directory: agent
      - name: Check Windows subnet and ARP readers (no active scan)
        working-directory: agent
        run: python -c "from cmdb_agent.discovery import local_subnets, neighbors; assert isinstance(local_subnets(), list); assert isinstance(neighbors(), dict)"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Build agent, tray and installer
        shell: pwsh
        run: ./agent/packaging/build-agent.ps1 -Installer
      - name: Verify silent tray startup (unconfigured workstation)
        shell: pwsh
        run: |
          $env:ProgramData = Join-Path $env:RUNNER_TEMP "cmdb-tray-smoke"
          New-Item -ItemType Directory -Force $env:ProgramData | Out-Null
          try {
            $tray = Start-Process ./agent/dist/cmdb-agent-tray.exe -PassThru
            Start-Sleep -Seconds 15
            $running = @(Get-Process -Name cmdb-agent-tray -ErrorAction SilentlyContinue)
            if ($running.Count -eq 0) { throw "Tray exited during startup" }
            if (@($running | Where-Object { $_.MainWindowHandle -ne 0 }).Count -gt 0) {
              throw "Tray opened a visible window at startup"
            }
          } finally {
            Get-Process -Name cmdb-agent-tray -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          if (-not (Test-Path ./agent/dist/CMDB-Agent-Setup-0.5.8.exe)) { throw "Installer missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: CMDB-Agent-Windows-0.5.8
          path: |
            agent/dist/cmdb-agent.exe
            agent/dist/cmdb-agent-tray.exe
            agent/dist/CMDB-Agent-Setup-0.5.8.exe
          if-no-files-found: error
