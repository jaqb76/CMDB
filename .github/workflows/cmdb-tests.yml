name: CMDB regression tests
on:
  push:
    branches: ["claude/os-data-collection-agent-gfz2o8"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cmdb
          POSTGRES_PASSWORD: cmdb
          POSTGRES_DB: cmdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cmdb -d cmdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-dev.txt
      - run: python -m pytest -v --durations=10 -o faulthandler_timeout=90
        working-directory: server
        env:
          PGOPTIONS: "-c lock_timeout=10000 -c statement_timeout=30000"
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
        working-directory: agent

  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests/test_discovery.py tests/test_tray_startup.py tests/test_unified_exe.py
        working-directory: agent
      - name: Check Windows subnet and ARP readers (no active scan)
        working-directory: agent
        run: python -c "from cmdb_agent.discovery import local_subnets, neighbors; assert isinstance(local_subnets(), list); assert isinstance(neighbors(), dict)"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem agent/packaging/*.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Build unified agent and optional installer
        shell: pwsh
        run: ./agent/packaging/build-agent.ps1 -OutputDir ./agent/dist/unified -Installer
      - name: Verify single EXE and silent startup, CLI and hot replacement
        shell: pwsh
        run: |
          $programs = @(Get-ChildItem ./agent/dist/unified/cmdb-agent*.exe)
          if ($programs.Count -ne 1 -or $programs[0].Name -ne 'cmdb-agent.exe') { throw "Expected one application EXE" }
          python agent/packaging/smoke-unified.py agent/dist/unified/cmdb-agent.exe
          if ($LASTEXITCODE -ne 0) { throw "Unified EXE smoke test failed" }
          if (-not (Test-Path ./agent/dist/unified/CMDB-Agent-Setup-0.5.9.exe)) { throw "Installer missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: CMDB-Agent-Windows-0.5.9
          path: |
            agent/dist/unified/cmdb-agent.exe
            agent/dist/unified/CMDB-Agent-Setup-0.5.9.exe
          if-no-files-found: error
