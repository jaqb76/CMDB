name: CMDB regression tests
on:
  push:
    branches: ["claude/os-data-collection-agent-gfz2o8"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release-plan:
    name: Decide whether the agent changed
    runs-on: ubuntu-latest
    outputs:
      agent_changed: ${{ steps.plan.outputs.agent_changed }}
      # Zmiana w skryptach jednego systemu nie buduje wydania dla drugiego:
      # plik bylby bajt w bajt taki sam, a opis zmian mowilby nie o nim.
      windows_changed: ${{ steps.plan.outputs.windows_changed }}
      linux_changed: ${{ steps.plan.outputs.linux_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare agent inputs and collect changelog
        id: plan
        env:
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          release_tag=$(git tag --list 'agent-v*' --sort=-version:refname | head -n 1)
          if [[ -n "$release_tag" ]]; then
            release_base=$(git rev-list -n 1 "$release_tag")
          else
            # Przed pierwszym automatycznym wydaniem cala historia jest
            # nieopublikowana. Puste drzewo sprawia, ze nie gubimy zmiany po
            # nieudanym CI i probujemy ponownie przy nastepnym commicie.
            release_base=$(git hash-object -t tree /dev/null)
          fi
          python scripts/release_plan.py --base "$release_base" --head "$HEAD_SHA" \
            --output agent-release-changelog.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.agent_changed == 'true'
        with:
          name: CMDB-Agent-Release-Plan-${{ github.run_id }}
          path: agent-release-changelog.json
          if-no-files-found: error
          # Artefakty sluza tylko publikacji w tym samym przebiegu - gotowe
          # wydanie lezy w GitHub Release. Domyslne 90 dni zapelnialo limit
          # miejsca konta i blokowalo kolejne wydania.
          retention-days: 3

  server:
    needs: release-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cmdb
          POSTGRES_PASSWORD: cmdb
          POSTGRES_DB: cmdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cmdb -d cmdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Allocate one version for this CI run and attempt
        if: needs.release-plan.outputs.agent_changed == 'true'
        id: version
        shell: bash
        run: |
          version=$(python agent/packaging/release_version.py --write)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pip install -r server/requirements-dev.txt
      - run: python -m pytest -v --durations=10 -o faulthandler_timeout=90
        working-directory: server
        env:
          PGOPTIONS: "-c lock_timeout=10000 -c statement_timeout=30000"
      - name: Build and smoke-test the Linux source package
        if: needs.release-plan.outputs.linux_changed == 'true'
        run: |
          python -m cmdb_server.pakiet ../agent --do ../agent/dist/source
          python ../scripts/smoke_source.py ../agent/dist/source/cmdb-agent-zrodla.tar.gz
        working-directory: server
      - uses: actions/upload-artifact@v4
        if: needs.release-plan.outputs.linux_changed == 'true'
        with:
          name: CMDB-Agent-Linux-${{ steps.version.outputs.version }}
          path: agent/dist/source/*
          if-no-files-found: error
          # Artefakty sluza tylko publikacji w tym samym przebiegu - gotowe
          # wydanie lezy w GitHub Release. Domyslne 90 dni zapelnialo limit
          # miejsca konta i blokowalo kolejne wydania.
          retention-days: 3
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: agent

  windows-agent:
    needs: release-plan
    if: needs.release-plan.outputs.windows_changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Allocate one version for this CI run and attempt
        id: version
        shell: bash
        run: |
          version=$(python agent/packaging/release_version.py --write)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pip install -r agent/requirements-dev.txt
      - run: python -m pytest -q tests/test_discovery.py tests/test_tray_startup.py tests/test_unified_exe.py tests/test_central_policy.py tests/test_gui_status.py
        working-directory: agent
      - name: Check Windows subnet and ARP readers (no active scan)
        working-directory: agent
        run: python -c "from cmdb_agent.discovery import local_subnets, neighbors; assert isinstance(local_subnets(), list); assert isinstance(neighbors(), dict)"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem agent/packaging/*.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Build unified agent and optional installer
        shell: pwsh
        run: ./agent/packaging/build-agent.ps1 -OutputDir ./agent/dist/unified -Installer
      - name: Verify single EXE and silent startup, CLI and hot replacement
        shell: pwsh
        run: |
          $programs = @(Get-ChildItem ./agent/dist/unified/*.exe | Where-Object { $_.Name -notlike 'CMDB-Agent-Setup-*' })
          if ($programs.Count -ne 1 -or $programs[0].Name -ne 'cmdb-agent.exe') { throw "Expected one application EXE" }
          python agent/packaging/smoke-unified.py agent/dist/unified/cmdb-agent.exe
          if ($LASTEXITCODE -ne 0) { throw "Unified EXE smoke test failed" }
          if (-not (Test-Path ./agent/dist/unified/CMDB-Agent-Setup-${{ steps.version.outputs.version }}.exe)) { throw "Installer missing" }
      - name: Render and verify native windows with synthetic status
        run: python agent/packaging/smoke-gui.py agent/dist/unified/gui-preview
      - uses: actions/upload-artifact@v4
        with:
          name: CMDB-Agent-Windows-${{ steps.version.outputs.version }}
          path: |
            agent/dist/unified/cmdb-agent.exe
            agent/dist/unified/CMDB-Agent-Setup-${{ steps.version.outputs.version }}.exe
            agent/dist/unified/verified-worker.json
            agent/dist/unified/gui-preview/*.png
          if-no-files-found: error
          # Artefakty sluza tylko publikacji w tym samym przebiegu - gotowe
          # wydanie lezy w GitHub Release. Domyslne 90 dni zapelnialo limit
          # miejsca konta i blokowalo kolejne wydania.
          retention-days: 3

  verify-release:
    name: Verify complete release with disposable test signature
    needs: [release-plan, server, agent, windows-agent]
    if: >-
      always() && needs.release-plan.outputs.agent_changed == 'true' &&
      needs.server.result == 'success' && needs.agent.result == 'success' &&
      needs.windows-agent.result != 'failure' && needs.windows-agent.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'cryptography>=42'
      - uses: actions/download-artifact@v4
        with:
          name: CMDB-Agent-Release-Plan-${{ github.run_id }}
          path: release
      - uses: actions/download-artifact@v4
        if: needs.release-plan.outputs.windows_changed == 'true'
        with:
          name: CMDB-Agent-Windows-${{ needs.server.outputs.version }}
          path: release
      - uses: actions/download-artifact@v4
        if: needs.release-plan.outputs.linux_changed == 'true'
        with:
          name: CMDB-Agent-Linux-${{ needs.server.outputs.version }}
          path: release
      - name: Validate tested binaries and signed manifest without publishing
        env:
          AGENT_RELEASE_VERSION: ${{ needs.server.outputs.version }}
        run: python scripts/check_release.py release --version "$AGENT_RELEASE_VERSION"

  publish:
    name: Publish signed agent release
    needs: [release-plan, server, agent, windows-agent, verify-release]
    if: >-
      always() && needs.release-plan.outputs.agent_changed == 'true' &&
      needs.verify-release.result == 'success' && github.event_name == 'push' &&
      github.repository == 'jaqb76/CMDB' &&
      github.ref == 'refs/heads/claude/os-data-collection-agent-gfz2o8'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: agent-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'cryptography>=42'
      - uses: actions/download-artifact@v4
        with:
          name: CMDB-Agent-Release-Plan-${{ github.run_id }}
          path: release
      - uses: actions/download-artifact@v4
        if: needs.release-plan.outputs.windows_changed == 'true'
        with:
          name: CMDB-Agent-Windows-${{ needs.server.outputs.version }}
          path: release
      - uses: actions/download-artifact@v4
        if: needs.release-plan.outputs.linux_changed == 'true'
        with:
          name: CMDB-Agent-Linux-${{ needs.server.outputs.version }}
          path: release
      - name: Sign manifest and publish complete GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMDB_RELEASE_SIGNING_KEY: ${{ secrets.CMDB_RELEASE_SIGNING_KEY }}
          AGENT_RELEASE_VERSION: ${{ needs.server.outputs.version }}
        run: python scripts/publish_agent.py release --version "$AGENT_RELEASE_VERSION"
